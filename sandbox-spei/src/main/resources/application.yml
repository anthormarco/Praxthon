server:
  port: 8080

spring:
  datasource:
    url: jdbc:h2:mem:sandbox_spei
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
  h2:
    console:
      enabled: true
      path: /h2-console
  jackson:
    deserialization:
      fail-on-unknown-properties: false

logging:
  level:
    org.hibernate.SQL: DEBUG
    com.praxis.sandbox_spei: DEBUG